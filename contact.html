<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bienvenue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
</head>
<body>
  <div class="custom-cursor"></div>
 <body class="light">
  <div class="container">
  <div class="top-actions-split">
  <button id="langSwitch" class="lang-switch" aria-label="Switch to English" tabindex="0">EN</button>
  <button id="themeSwitch" class="theme-switch" aria-label="Basculer le mode sombre" tabindex="0">🌙</button>
  </div>
  <audio id="sound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_11fcf7a5e3.mp3"></audio>
    <div class="logo">
       <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="48" stroke="currentColor" stroke-width="4"/>
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-size="32" fill="currentColor" font-family="Arial" font-weight="bold">N</text>
      </svg>
    </div>
    <h2 data-fr="Contactez-moi" data-en="Contact me">Contactez-moi</h2>
    <form class="contact-form" id="contactForm" autocomplete="off">
      <label>
        <span data-fr="Nom" data-en="Name">Nom</span>
        <input type="text" name="name" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" required>
      </label>
      <label>
        <span data-fr="Message" data-en="Message">Message</span>
        <textarea name="message" rows="4" required></textarea>
      </label>
      <button type="submit" id="sendBtn" tabindex="0" data-fr="Envoyer" data-en="Send">Envoyer</button>
    </form>
    <div class="btn-group">
      <button onclick="window.history.back()" tabindex="0">← Retour</button>
    </div>
    <div class="socials" style="margin-top:18px;">
      <div class="socials">
      <a href="https://linkedin.com/" class="social-link" target="_blank" aria-label="LinkedIn">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 32 32" fill="none">
    <path d="M8 12h4v12H8V12zm2-6a2 2 0 100 4 2 2 0 000-4zm6 6h4v2h.02c.55-1.04 1.89-2 3.98-2C26.88 12 28 13.06 28 15.28V24h-4v-7.24c0-1.31-.02-3-1.82-3-1.82 0-2.1 1.42-2.1 2.89V24h-4V12z" fill="currentColor"/>
  </svg>
</a>
  <a href="https://instagram.com/" class="social-link" target="_blank" aria-label="Instagram">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
    <circle cx="17" cy="7" r="1.5" fill="currentColor"/>
  </svg>
</a>
<a href="mailto:natgene1950@gmail.com" class="social-link" aria-label="Email">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="2"/>
    <path d="M3 7l9 7l9-7" stroke="currentColor" stroke-width="2" fill="none"/>
  </svg>
</a>
</div>
    </div>
  </div>
  <script src="../js/script.js"></script>
</body>
</html>
